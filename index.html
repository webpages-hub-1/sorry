<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إشعار جديد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Lalezar&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#14102B;--pink:#FF4D8D;--sun:#FFE45C;--sky:#5CE1FF;--tang:#FF9A3D;--lil:#B9A4FF;--grn:#2BE07B}
html,body{height:100%}
body{font-family:Cairo,system-ui,sans-serif;font-weight:600;background:var(--ink);color:#fff;display:grid;place-items:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(40vmax 40vmax at 20% 25%,var(--pink),transparent 60%),radial-gradient(40vmax 40vmax at 80% 75%,var(--sky),transparent 60%),var(--ink);filter:blur(30px);opacity:.75}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.phone{position:relative;width:min(100vw,410px);height:min(100svh,860px);overflow:hidden;background:#000;isolation:isolate}
@media(min-width:480px){.phone{border-radius:46px;border:8px solid #0b0818;box-shadow:0 30px 80px #000a}}
.wall{position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 45% at 15% 12%,var(--tang),transparent 70%),radial-gradient(60% 45% at 92% 38%,var(--sky),transparent 70%),radial-gradient(80% 55% at 30% 98%,var(--lil),transparent 70%),linear-gradient(160deg,#FF4D8D,#7A4DFF)}
.sb{position:absolute;top:0;inset-inline:0;height:46px;padding:14px 26px 0;display:flex;justify-content:space-between;font-weight:800;font-size:14px;z-index:30;pointer-events:none;transition:color .2s}
.lt .sb{color:var(--ink)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding-top:48px}
.scr.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:scale(.97)}}
/* lock */
#lock{align-items:center;touch-action:none;user-select:none;padding-inline:14px}
.dt{margin-top:26px;font-weight:800;font-size:19px;text-shadow:0 1px 8px #0004}
#clk{font-family:Lalezar,Cairo,sans-serif;font-size:112px;line-height:1.05;text-shadow:0 4px 24px #0004;direction:ltr}
.nts{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:22px}
.nt{background:#ffffff38;border:1px solid #ffffff59;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px;padding:11px 14px;animation:drop .55s cubic-bezier(.2,1.4,.4,1) both,shk .5s .5s}
.nt .t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;opacity:.9}
.nt .t b{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#2BE07B,#12B886);display:grid;place-items:center;font-size:12px}
.nt .t i{margin-inline-start:auto;font-style:normal;font-weight:600}
.nt h4{font-size:15px;margin-top:4px}
.nt p{font-size:15px;line-height:1.5}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.94)}}
@keyframes shk{20%{transform:rotate(-1.2deg)}40%{transform:rotate(1.2deg)}60%{transform:rotate(-.6deg)}}
.hdl{margin-top:auto;padding:10px 0 22px;text-align:center;font-weight:800;font-size:14px;opacity:0;transition:opacity .6s}
.hdl.on{opacity:1;animation:bob 1.6s infinite}
.hdl::before{content:"";display:block;width:130px;height:5px;border-radius:9px;background:#fff;margin:0 auto 10px}
@keyframes bob{50%{transform:translateY(-6px)}}
/* home */
#home{padding-inline:20px}
.wd{margin-top:14px;background:#ffffff38;border:1px solid #ffffff59;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:26px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.wd big{font-family:Lalezar,Cairo,sans-serif;font-size:64px;line-height:1;color:var(--sun);text-shadow:3px 3px 0 var(--ink);transition:transform .4s}
.wd p{font-size:16px;font-weight:800;line-height:1.4}.wd small{display:block;font-weight:600;font-size:13px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;margin-top:26px}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;text-shadow:0 1px 6px #0006}
.ic{position:relative;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:30px;box-shadow:inset 0 1px 0 #fff8,0 6px 14px #0004;transition:transform .15s}
.ap:active .ic{transform:scale(.9)}
.bd{position:absolute;top:-7px;inset-inline-end:-7px;min-width:22px;height:22px;border-radius:99px;background:#FF3B30;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;text-shadow:none}
.ok .bd{background:var(--grn);color:var(--ink)}
.dock{margin-top:auto;margin-bottom:18px;align-self:center;background:#ffffff38;border:1px solid #ffffff59;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:30px;padding:12px 26px}
/* apps */
.hd{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;font-weight:800;font-size:19px}
.back{font-size:16px;padding:6px 8px;border-radius:10px}
#a-msg{background:#0d1a1f}#a-msg .hd{background:#16252c}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--tang));display:grid;place-items:center;font-weight:800}
.hd small{display:block;font-size:12px;font-weight:600;opacity:.7}
.chat{flex:1;overflow:auto;padding:14px 14px 20px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(circle at 20% 10%,#ffffff08,transparent 40%)}
.b{max-width:82%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:#1f3138;font-size:16px;line-height:1.5;align-self:flex-start}
.b.me{background:#0b6b4d;border-radius:16px 16px 4px 16px;align-self:flex-end}
.b small{display:block;font-size:12px;color:var(--sky);margin-top:2px}
.del{align-self:flex-end;text-align:right;background:#1f3138;border:1.5px dashed #ffffff40;border-radius:16px 16px 4px 16px;padding:9px 13px;font-size:15px;font-style:italic;opacity:.85;max-width:86%}
.del.open{background:#0b6b4d;border:1.5px solid var(--sun);font-style:normal;opacity:1;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.del em{display:block;font-size:13px;color:var(--sun);margin-top:3px}
@keyframes pop{from{transform:scale(.92)}}
.inp{margin:0 12px 14px;padding:11px 16px;border-radius:99px;background:#16252c;font-size:15px;opacity:.7}
#a-note{background:#FFE45C;color:var(--ink)}
#a-note .hd{color:#b8860b}
.note{flex:1;overflow:auto;padding:4px 22px 30px;font-size:19px;font-weight:700;line-height:1.95;white-space:pre-line;background-image:repeating-linear-gradient(transparent 0 calc(1.95em - 1.5px),#14102b1f calc(1.95em - 1.5px) 1.95em);background-attachment:local}
.note h2{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:34px;line-height:1.2;margin-bottom:8px}
#a-song{background:var(--ink)}
.sg{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 28px 30px;text-align:center}
.disc{width:min(62vw,230px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:56px;background:radial-gradient(circle,var(--pink) 0 16%,var(--ink) 17% 19%,transparent 20%),repeating-radial-gradient(circle,#2a2250 0 3px,#14102B 3px 6px);border:4px solid #fff;box-shadow:0 0 0 8px #ffffff22,0 20px 50px #FF4D8D66;margin-top:8px}
.disc img{display:none;width:46%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #fff}
.disc.has img{display:block}.disc.has #em{display:none}
.disc.sp{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lb{display:block;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg h3:empty,.sg .ar:empty{display:none}
.sg h3{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:36px;line-height:1.1;margin-top:10px}
.sg .ar{opacity:.75;font-size:16px}
.pbar{width:100%;height:6px;border-radius:9px;background:#ffffff30;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--sun)}
.why{font-size:19px;font-weight:700;line-height:1.7;margin:10px 0 6px}
/* call */
#call{align-items:center;text-align:center;background:linear-gradient(#14102Bd9,#14102Bf2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding-top:110px}
.big{position:relative;width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--tang));display:grid;place-items:center;font-family:Lalezar,Cairo,sans-serif;font-size:56px}
.big::before,.big::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--pink);animation:rg 1.8s infinite}
.big::after{animation-delay:.9s}
@keyframes rg{to{transform:scale(1.9);opacity:0}}
#call h2{font-size:32px;margin-top:26px}
#call p{opacity:.8;font-size:17px;margin-top:6px;padding:0 30px}
.btns{margin-top:auto;margin-bottom:96px;width:100%;display:flex;justify-content:center;gap:16px;padding:0 20px}
#dec{touch-action:none;user-select:none;-webkit-user-select:none;transition:left .25s cubic-bezier(.3,1.4,.5,1),top .25s}
.pill{padding:16px 34px;border-radius:99px;font-size:21px;font-weight:800;color:#fff;box-shadow:0 8px 24px #0006}
.pill.no{background:#FF3B30}.pill.yes{background:var(--grn);color:var(--ink);animation:bob 1s infinite}
.msgb{position:absolute;bottom:20px;inset-inline:0;font-size:14px;text-decoration:underline;opacity:.8}
.calm .msgb,.calm #cs{display:none}
#cm{display:none}.calm #cm{display:block}
.btn{font-weight:800;font-size:19px;padding:12px 28px;border:3px solid var(--ink);background:var(--grn);color:var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);text-decoration:none;display:inline-block}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
#card{align-items:center;background:linear-gradient(#14102Bd9,#14102Bf2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:70px 22px 30px}
.cc{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
.cc small{display:block;font-size:14px;font-weight:600;color:var(--grn);direction:ltr;text-align:start}
.caps{flex:1;width:100%;display:flex;flex-direction:column;justify-content:center;gap:16px}
.ln{font-size:26px;font-weight:800;line-height:1.55;transition:opacity .4s;animation:in .4s}
.ln.old{opacity:.35}
.rp{width:100%;text-align:center}
.rp p{font-size:14px;opacity:.7;margin-bottom:10px}
.chip{display:block;margin-top:9px;padding:14px;border-radius:99px;border:2px solid #fff;font-weight:800;font-size:18px;color:#fff;text-decoration:none;background:#ffffff14;animation:in .4s both}
.chip:active{background:#fff;color:var(--ink)}
#a-pho{background:var(--ink)}
.col{position:relative;margin:6px 16px 0;aspect-ratio:1/1.1;max-height:56%}
.pl{position:absolute;background:#fff;color:var(--ink);padding:5px 5px 20px;border-radius:5px;box-shadow:0 10px 26px #0009;transform:rotate(var(--r));text-align:center;font-size:11px;font-weight:800}
.pl .im{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;display:grid;place-items:center;font-size:34px;background:linear-gradient(150deg,var(--tang),var(--pink))}
.pl .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl span{position:absolute;bottom:4px;inset-inline:0}
.pl.mn{width:76%;left:12%;top:2%;--r:-2deg;padding:9px 9px 56px;z-index:2}
.pl.mn::before{content:"";position:absolute;top:-13px;left:50%;width:92px;height:26px;background:#FFE45Ccc;transform:translateX(-50%) rotate(-3deg)}
.pl.mn .im{font-size:70px;background:linear-gradient(150deg,var(--sky),var(--lil))}
.pl.mn span{bottom:12px;font-family:Caveat,cursive;font-size:30px;font-weight:700;line-height:1}
.tg{text-align:center;margin-top:14px}
.tg small{font-size:16px;opacity:.8;font-weight:800}
.tg b{display:block;font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:64px;line-height:1.05;color:var(--sun);text-shadow:3px 3px 0 var(--pink)}
.tg p{font-size:20px;font-weight:800}
.tg .hms{direction:ltr;font-size:22px;font-weight:800;letter-spacing:1px;margin-top:4px;opacity:.9}
.chip{width:100%;font-family:inherit}
.pop{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:#14102B99;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pop.on{display:grid;animation:in .25s}
.pc{width:min(84%,330px);background:var(--sun);color:var(--ink);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:28px;padding:26px 22px 20px;text-align:center;animation:pp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pp{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.pc .em:empty{display:none}
.pc .em{font-size:68px;line-height:1}
.pc h3{font-family:Lalezar,Cairo,sans-serif;font-weight:400;font-size:27px;line-height:1.4;margin:12px 0 16px}
.pc h3.big{font-size:56px;line-height:1.1}
.pc .x{display:block;margin:12px auto 0;font-weight:800;font-size:15px;opacity:.6}
#hz{position:absolute;inset:0;z-index:50;pointer-events:none;overflow:hidden}
#hz span{position:absolute;opacity:0;animation:hp 2.4s ease-out both}
@keyframes hp{0%{opacity:0;transform:translateY(20px) scale(.2)}20%{opacity:1}100%{opacity:0;transform:translateY(-150px) scale(1.2) rotate(var(--rt))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="phone" id="ph">
<div class="wall"></div>
<div class="sb"><span id="sbt"></span><span>5G ▂▄▆</span></div>

<section class="scr on" id="lock">
 <div class="dt" id="dt"></div>
 <div id="clk"></div>
 <div class="nts" id="nts"></div>
 <div class="hdl" id="hdl">اسحبي لفوق عشان تفتحي</div>
</section>

<section class="scr" id="home">
 <div class="wd"><big id="dy"></big><p>يوم زعل<small>الرقم ده هيقف النهاردة إن شاء الله</small></p></div>
 <div class="grid">
  <button class="ap" data-o="msg"><div class="ic" id="i-msg" style="background:linear-gradient(160deg,#2BE07B,#12B886)">💬<span class="bd">5</span></div>رسايل</button>
  <button class="ap" data-o="song"><div class="ic" id="i-song" style="background:linear-gradient(160deg,#5CE1FF,#7A4DFF)">🎧<span class="bd">1</span></div><span class="lb" id="sl">أغنية</span></button>
  <button class="ap" data-o="pho"><div class="ic" id="i-pho" style="background:linear-gradient(160deg,#FF9A3D,#FF4D8D)">🖼️<span class="bd">1</span></div>الصور</button>
  <button class="ap" data-o="note"><div class="ic" id="i-note" style="background:linear-gradient(160deg,#FFE45C,#FF9A3D)">📝<span class="bd">1</span></div>ملاحظات</button>
 </div>
 <div class="dock"><div class="ic" id="i-tel" style="background:linear-gradient(160deg,#2BE07B,#12B886)">📞</div></div>
</section>

<section class="scr" id="a-msg" data-lt="0">
 <div class="hd"><button class="back" data-b>› رجوع</button><div class="av" id="av1"></div><div><span id="nm1"></span><small>آخر ظهور دلوقتي (بيستنى)</small></div></div>
 <div class="chat" id="chat"></div>
 <div class="inp">اكتبي رد…</div>
</section>

<section class="scr" id="a-note" data-lt="1">
 <div class="hd"><button class="back" data-b>› ملاحظات</button></div>
 <div class="note" id="note"></div>
</section>

<section class="scr" id="a-pho" data-lt="0">
 <div class="hd"><button class="back" data-b>› رجوع</button>الصور</div>
 <div class="col" id="col"></div>
 <div class="tg"><small>بقالنا</small><b id="dd">٠</b><p>يوم مع بعض 🤍</p><div class="hms" id="hms"></div></div>
</section>

<section class="scr" id="a-song" data-lt="0">
 <div class="hd"><button class="back" data-b>› رجوع</button><span id="sh">الأغنية</span></div>
 <div class="sg">
  <div class="disc" id="disc"><span id="em">🎧</span><img id="cv" alt=""></div>
  <h3 id="st"></h3><p class="ar" id="sa"></p>
  <div class="pbar"><i id="pb"></i></div>
  <p class="why">عاوزك تسمعي الأغنية دي 🎧</p>
  <a class="btn" id="sp" target="_blank" rel="noopener">شغّليها</a>
 </div>
</section>

<section class="scr" id="call">
 <div class="big" id="av2"></div>
 <h2 id="nm2" dir="ltr"></h2>
 <p id="cs">بيتصل بيكي… (ردي. بجد.)</p>
 <p id="cm">خدي وقتك. مفيش استعجال، والموقع ده مش هيروح في حتة.</p>
 <div class="btns"><button class="pill no" id="dec">هكلسن</button><button class="pill yes" id="acc">هرد</button></div>
 <button class="msgb" id="msgb">رسالة</button>
</section>

<section class="scr" id="card">
 <div class="cc"><div class="av" id="av3"></div><div><span id="nm3" dir="ltr"></span><small id="tm">00:00</small></div></div>
 <div class="caps" id="caps"></div>
 <div class="rp" id="rp" hidden><p>ردي عليه 👇</p><div id="chips"></div></div>
</section>

<div class="pop" id="pop"><div class="pc"><div class="em" id="pe"></div><h3 id="px"></h3><a class="btn" id="pw" target="_blank" rel="noopener">كملي على واتساب</a><button class="x" id="px2">رجوع</button></div></div>
<div id="hz"></div>
</div>

<script>
/* ===== عدّلي هنا بس لكل عميل ===== */
const CFG={
 him:"Ahmed", call:"ahmed", days:"٣",
 phone:"",   // واتساب بالصيغة الدولية بدون + ، مثال 201001234567
 notifs:["أنا آسف","وحشتيني أوي","عملتلك حاجة مخصوص، افتحي وشوفي 🤍"],
 del:[["أنا آسف..","كتبتلك آسف ١٢ مرة ومبعتش، حسيتها صغيرة على اللي حصل."],["مش قصدي..","ولا مرة قصدت أزعلك، بس عارف إن النية لوحدها مش كفاية."],["وحشتيني","كتبتها الساعة ٣ الفجر ومسحتها عشان ماضغطش عليكي."],["بصي بقى..","كنت هبرر، وبعدين فهمت إنك مش محتاجة تبرير، محتاجة تحسي إني فاهم."],["ردي عليا","لأ، خدي وقتك. بس أنا هنا."]],
 note:`حبيبتي،

أنا عارف إني غلطت، ومش جاي أقولك إنك مبالغة. بس جاي أقولك إنك أكتر حد بيخليني أبقى نسخة أحسن مني، وأنا مكنتش عاوز نوصل لكده.

مش هوعدك إني مش هغلط تاني. بس هوعدك إني أحاول أسمع قبل ما أرد، وأعتذر بدري مش بعد ما الزعل يكبر، ونساعد بعض دايمًا نكون أحسن.

الموقع ده أبسط حاجة أقدر أعملها، والباقي هقوله لك face to face.

Ahmed`,
 since:"2025-01-01T00:00:00",   // تاريخ بداية علاقتكم (سنة-شهر-يوم)
 photo:{main:"us",cap:"I will always love you"},   // احفظي صورتكم باسم us (jpg أو png أو jpeg أو webp) جنب الملف
 lines:["ألو؟","أنا حضّرت كلام كتير، ونسيته كله أول ما سمعت صوتك.","فهسمعك الأول. قوليلي."],
 replies:[
  ["لسه زعلانة شوية","لسه زعلانة شوية، بس كلمني","","وأنا ميهونش عليا زعلك يا حبيبتي.. كلميني وأنا هصلح كل حاجة حصلت",0],
  ["تعالى نتكلم","تعالى نتكلم","","بحبك",1],
  ["وحشتني","وحشتني 🤍","","وإنتي كمان..",1]],
 songUrl:"https://youtu.be/7eWFGfIxMFI?si=69DN_RjP9IrSYEeY",
 songName:"متتعوضش", artist:"عمرو دياب"   // اكتبيهم هنا بإيدك لو عاوزة، ولو سبتيهم فاضيين بيتجابوا من يوتيوب   // حطي لينك اليوتيوب هنا بس، واسم الأغنية والغلاف بيتجابوا لوحدهم
};

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],ph=$('#ph');
const vib=n=>navigator.vibrate&&navigator.vibrate(n);
function show(id){$$('.scr').forEach(e=>e.classList.toggle('on',e.id==id));ph.classList.toggle('lt',$('#'+id).dataset.lt=='1')}
function tick(){const d=new Date(),t=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});$('#clk').textContent=t;$('#sbt').textContent=t;$('#dt').textContent=d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,10000);
$('#av1').textContent=CFG.him.trim()[0];$('#av2').textContent=CFG.call[0].toUpperCase();$('#nm1').textContent=CFG.him;$('#nm2').textContent=CFG.call;$('#av3').textContent=CFG.call[0].toUpperCase();$('#nm3').textContent=CFG.call;
$('#dy').textContent=CFG.days;

/* lock: إشعارات بتنزل */
CFG.notifs.forEach((t,i)=>setTimeout(()=>{const n=document.createElement('div');n.className='nt';n.innerHTML=`<div class="t"><b>💬</b>رسايل<i>دلوقتي</i></div><h4>${CFG.him}</h4><p>${t}</p>`;$('#nts').append(n);vib(70)},700+i*1400));
setTimeout(()=>$('#hdl').classList.add('on'),700+CFG.notifs.length*1400);
const lk=$('#lock');let y0=null;
function unlock(){lk.style.transform=lk.style.opacity='';show('home')}
lk.addEventListener('pointerdown',e=>y0=e.clientY);
lk.addEventListener('pointermove',e=>{if(y0==null)return;const d=Math.min(0,e.clientY-y0);lk.style.transform=`translateY(${d}px)`;lk.style.opacity=1+d/450});
const up=e=>{if(y0==null)return;const d=e.clientY-y0;y0=null;if(d<-90||Math.abs(d)<6)unlock();else{lk.style.transform=lk.style.opacity=''}};
lk.addEventListener('pointerup',up);lk.addEventListener('pointercancel',()=>{y0=null;lk.style.transform=lk.style.opacity=''});

/* تقدم الأربع تطبيقات */
const done=new Set();
function fin(k){if(done.has(k))return;done.add(k);const i=$('#i-'+k);i.classList.add('ok');i.querySelector('.bd').textContent='✓';
 if(done.size==4){$('#dy').textContent='٠';setTimeout(ring,2200)}}
$$('.ap').forEach(b=>b.onclick=()=>{const k=b.dataset.o;show('a-'+k);if(k=='note')startNote();if(k=='pho')startPho()});
$$('[data-b]').forEach(b=>b.onclick=()=>show('home'));

/* رسايل */
const ch=$('#chat');
ch.innerHTML=CFG.del.map(([d,c])=>`<button class="del" data-d="${d}" data-c="${c}">🚫 الرسالة دي اتمسحت. دوسي تشوفيها</button>`).join('');
let op=0;$$('.del').forEach(b=>b.onclick=()=>{if(b.classList.contains('open'))return;b.classList.add('open');b.innerHTML=`${b.dataset.d}<em>${b.dataset.c}</em>`;vib(30);if(++op==CFG.del.length)fin('msg')});

/* ملاحظات */
let nt=0;
function startNote(){if(nt)return;nt=1;const el=$('#note'),[h,...r]=CFG.note.split('\n'),tx=r.join('\n');el.innerHTML=`<h2>${h}</h2><span id="nb"></span>`;const nb=$('#nb');let i=0;
 el.onclick=()=>{i=tx.length-1};
 (function t(){nb.textContent=tx.slice(0,++i);el.scrollTop=el.scrollHeight;if(i<tx.length)setTimeout(t,28);else fin('note')})()}

/* صور */
const A=n=>n.toLocaleString('ar-EG'),P2=n=>(n<10?'٠':'')+A(n);
const ph1=m=>`<div class="pl ${m[3]}"><div class="im">${m[2]}<img alt=""></div><span>${m[1]}</span></div>`;
$('#col').innerHTML=ph1([CFG.photo.main,CFG.photo.cap,'💞','mn']);
const since=new Date(CFG.since).getTime();
function tg(){const d=Math.max(0,Date.now()-since);$('#dd').textContent=A(Math.floor(d/864e5));$('#hms').textContent=[Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60].map(P2).join(':')}
{const im=$('#col .mn img'),ex=['jpg','jpeg','png','webp','JPG','JPEG','PNG'];let n=0;im.onerror=()=>{if(n<ex.length)im.src=CFG.photo.main+'.'+ex[n++];else im.remove()};im.onerror()}
let pt=0;function startPho(){if(pt)return;pt=1;tg();setInterval(tg,1000);setTimeout(()=>fin('pho'),2200)}

/* أغنية */
const U=CFG.songUrl,Y=(U.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||[])[1];
$('#sp').href=U||'#';
const setT=(t,a)=>{t=t.replace(/\s*[\(\[][^\)\]]*(official|video|lyrics|audio|clip|visualizer|فيديو|كليب)[^\)\]]*[\)\]]/gi,'').trim();a=a.replace(/ - Topic$/,'');$('#st').textContent=t;$('#sa').textContent=a;$('#sh').textContent=t};
if(CFG.songName)setT(CFG.songName,CFG.artist||'');
if(Y){const cv=$('#cv');cv.onerror=()=>$('#disc').classList.remove('has');cv.src='https://img.youtube.com/vi/'+Y+'/hqdefault.jpg';$('#disc').classList.add('has');
 (async()=>{if(CFG.songName)return;for(const a of['https://www.youtube.com/oembed?format=json&url=','https://noembed.com/embed?url=']){try{const j=await(await fetch(a+encodeURIComponent(U))).json();if(j.title){setT(j.title,j.author_name||'');return}}catch(e){}}})()}
$('#sp').onclick=e=>{if(!U)e.preventDefault();$('#disc').classList.add('sp');const p=$('#pb');p.style.transition='width 40s linear';p.style.width='100%';fin('song')};

/* مكالمة */
function ring(){show('call');$('#i-tel').innerHTML='📞<span class="bd">1</span>';vib([300,150,300,150,300])}
const dec=$('#dec');let side=0;
function dodge(e){e.preventDefault();e.stopPropagation();const c=$('#call').getBoundingClientRect(),r=dec.getBoundingClientRect(),w=r.width,h=r.height;
 const top=dec.style.position=='absolute'?parseFloat(dec.style.top):r.top-c.top;
 if(dec.style.position!='absolute'){dec.style.position='absolute';dec.style.left=(r.left-c.left)+'px'}
 dec.style.top=Math.max(c.height*.45,Math.min(c.height-h-24,top+Math.random()*50-25))+'px';
 const a=$('#acc').getBoundingClientRect(),L=[8,a.left-c.left-w-8],R=[a.right-c.left+8,c.width-w-8];
 side^=1;let z=side?L:R;if(z[1]<z[0])z=side?R:L;
 dec.style.left=(z[0]+Math.random()*Math.max(0,z[1]-z[0]))+'px';vib(25)}
['pointerenter','pointerdown','touchstart','mousedown','click'].forEach(v=>dec.addEventListener(v,dodge,{passive:false}));
$('#msgb').onclick=()=>$('#call').classList.add('calm');
$('#acc').onclick=()=>{show('card');vib([40,60,40]);runCall()};
function hearts(){const z=$('#hz'),h=['❤️','🩷','🤍','💖','💗'];for(let i=0;i<46;i++){const e=document.createElement('span');e.textContent=h[i%5];e.style.cssText=`left:${Math.random()*92}%;top:${Math.random()*88}%;font-size:${20+Math.random()*34}px;animation-delay:${Math.random()*1.4}s;--rt:${(Math.random()*60-30)|0}deg`;z.append(e);setTimeout(()=>e.remove(),4300)}}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const [,t,em,x,fx]=CFG.replies[b.dataset.i];$('#pe').textContent=em;const h=$('#px');h.textContent=x;h.className=x.length<12?'big':'';$('#pw').href='https://wa.me/'+CFG.phone+'?text='+encodeURIComponent(t);$('#pop').classList.add('on');vib(40);if(fx)hearts()};
$('#px2').onclick=()=>$('#pop').classList.remove('on');
$('#pop').onclick=e=>{if(e.target.id=='pop')$('#pop').classList.remove('on')};
function runCall(){const L=CFG.lines,box=$('#caps');let sec=0;
 setInterval(()=>{sec++;$('#tm').textContent='00:'+String(sec).padStart(2,'0')},1000);
 let i=0;(function next(){if(i>=L.length){$('#chips').innerHTML=CFG.replies.map((r,i)=>`<button class="chip" data-i="${i}">${r[0]}</button>`).join('');$('#rp').hidden=false;return}
  const p=document.createElement('p');p.className='ln';box.append(p);[...box.children].forEach((c,j,a)=>c.classList.toggle('old',j<a.length-1));
  const t=L[i++];let k=0;(function ty(){p.textContent=t.slice(0,++k);if(k<t.length)setTimeout(ty,45);else setTimeout(next,900)})()})()}
</script>
</body>
</html>
